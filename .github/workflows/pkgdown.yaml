# Builds the pkgdown documentation site and deploys it to the gh-pages branch.
# BigDataStatMeth is a GitHub-only dependency (the package links its C++
# headers), so it is installed from source, mirroring R-CMD-check.yaml.
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # only build/deploy for the repo owner's pushes, not forks' PRs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write        # needed to push the built site to gh-pages
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies (HDF5)
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev libcurl4-openssl-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            bioc::Rhdf5lib
            bioc::impute
            bioc::MultiAssayExperiment
            bioc::SummarizedExperiment
            github::isglobal-brge/BigDataStatMeth
            local::.
          needs: website

      # CLAUDE.md is internal development notes; pkgdown would otherwise render
      # it into the public site. Remove it from this ephemeral CI checkout only
      # (the file stays in the repo).
      - name: Drop internal notes from the site build
        run: rm -f CLAUDE.md

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
