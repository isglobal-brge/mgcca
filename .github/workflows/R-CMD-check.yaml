# Runs R CMD check on the main branches. BigDataStatMeth is a GitHub-only
# dependency and the package links to its C++ headers, so it is installed from
# source before the check.
on:
  push:
    branches: [main, master, cpp-port-bigdatastatmeth]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies (HDF5)
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev libcurl4-openssl-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            bioc::Rhdf5lib
            bioc::rhdf5
            bioc::impute
            bioc::MultiAssayExperiment
            bioc::SummarizedExperiment
            github::isglobal-brge/BigDataStatMeth
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
